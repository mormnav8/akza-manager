<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duelo de Cartas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>Duelo de Cartas</h1>
      <p>Controla el duelo, los personajes y las acciones de cada turno.</p>
    </header>

    <section id="setup-screen" class="screen active-screen">
      <div class="setup-row">
        <article class="player-card" id="player-0-card">
          <h2>Jugador 1</h2>
          <div class="field-group">
            <label for="player-0-name">Nombre</label>
            <input id="player-0-name" type="text" placeholder="Nombre del jugador" />
          </div>
          <div class="field-group">
            <label for="player-0-hp">Vida máxima</label>
            <input id="player-0-hp" type="number" min="1" value="20" />
          </div>
          <div class="field-group">
            <label for="player-0-stamina">Stamina máxima</label>
            <input id="player-0-stamina" type="number" min="1" value="10" />
          </div>
          <div class="field-group">
            <label for="player-0-dex">Destreza (1-5)</label>
            <input id="player-0-dex" type="number" min="1" max="5" value="3" />
          </div>
          <button class="primary-button" data-player="0" id="save-player-0">Guardar jugador 1</button>
        </article>

        <article class="player-card" id="player-1-card">
          <h2>Jugador 2</h2>
          <div class="field-group">
            <label for="player-1-name">Nombre</label>
            <input id="player-1-name" type="text" placeholder="Nombre del jugador" />
          </div>
          <div class="field-group">
            <label for="player-1-hp">Vida máxima</label>
            <input id="player-1-hp" type="number" min="1" value="20" />
          </div>
          <div class="field-group">
            <label for="player-1-stamina">Stamina máxima</label>
            <input id="player-1-stamina" type="number" min="1" value="10" />
          </div>
          <div class="field-group">
            <label for="player-1-dex">Destreza (1-5)</label>
            <input id="player-1-dex" type="number" min="1" max="5" value="3" />
          </div>
          <button class="primary-button" data-player="1" id="save-player-1">Guardar jugador 2</button>
        </article>
      </div>

      <div class="actions-row">
        <button class="primary-button" id="start-duel" disabled>Comenzar duelo</button>
      </div>
    </section>

    <section id="roll-screen" class="screen">
      <div class="roll-box">
        <h2>Decidir quién empieza</h2>
        <p id="roll-text">Pulsa comenzar para lanzar el dado de 1 a 20 para cada jugador.</p>
        <button class="primary-button" id="roll-button">Lanzar dados</button>
        <p class="muted" id="starter-text"></p>
        <button class="primary-button hidden" id="confirm-start">Comenzar batalla</button>
      </div>
    </section>

    <section id="battle-screen" class="screen">
      <div class="battle-header">
        <h2 id="battle-title">Turno de jugador</h2>
        <div class="player-status">
          <span id="current-turn-label"></span>
          <button class="secondary-button" id="restart-button">Reiniciar</button>
        </div>
      </div>

      <div class="status-grid">
        <button class="status-card" data-action="health" id="action-health">
          <strong>Vida</strong>
          <div class="stat-value" id="stat-health"></div>
          <progress id="health-bar" max="100" value="0"></progress>
        </button>
        <button class="status-card" data-action="stamina" id="action-stamina">
          <strong>Stamina</strong>
          <div class="stat-value" id="stat-stamina"></div>
          <progress id="stamina-bar" max="100" value="0"></progress>
        </button>
        <button class="status-card" data-action="block" id="action-block">
          <strong>Bloqueo</strong>
          <div class="stat-value" id="stat-block"></div>
        </button>
        <button class="status-card" data-action="attack" id="action-attack">
          <strong>Daño</strong>
          <div class="stat-value">Atacar</div>
        </button>
      </div>

      <div class="status-grid" style="margin-top:12px;">
        <button class="status-card" data-action="pass" id="action-pass">
          <strong>Pasar</strong>
          <div class="stat-value">Ganar Stamina</div>
        </button>
      </div>

      <div style="margin-top:12px; display:flex; gap:12px;">
        <button class="primary-button" id="end-turn">Finalizar acción</button>
        <button class="secondary-button" id="restart-button-2">Reiniciar</button>
      </div>

      <div class="action-panel hidden" id="action-panel">
        <h3 id="action-panel-title"></h3>
        <div class="action-content" id="action-content"></div>
      </div>

      <div class="battle-log" id="battle-log"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
