<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Duelo de Cartas</title>
  <link rel="stylesheet" href="styles.css?v=20260730-5" />
</head>
<body>
  <main class="app-shell">
    <header>
      <h1 id="app-title"></h1>
    </header>

    <section id="home-screen" class="screen active-screen">
      <div class="roll-box">
        <h2>Personajes</h2>
        <div id="home-actions" style="display:flex;gap:8px;justify-content:center;margin:10px 0">
          <button class="primary-button" id="create-character">Crear personaje</button>
          <button class="secondary-button" id="view-history">Historial</button>
          <button class="primary-button" id="start-battle-selected">Iniciar batalla</button>
        </div>
        <div id="home-list"></div>
        <div id="history-list" class="hidden" style="margin-top:12px;text-align:left;max-height:240px;overflow:auto;background:rgba(0,0,0,0.05);padding:8px;border-radius:8px"></div>
      </div>
    </section>

    <section id="setup-screen" class="screen">
      <div class="setup-row">
        <article class="player-card" id="player-0-card">
          <button class="player-title-button" data-player="0" id="player-0-title" type="button">Jugador 1</button>
          <div class="attribute-buttons-row">
            <button class="attribute-pill" data-player="0" data-attr="hp" type="button">Vida: 20</button>
            <button class="attribute-pill" data-player="0" data-attr="stamina" type="button">Stamina: 10</button>
            <button class="attribute-pill" data-player="0" data-attr="dex" type="button">Destreza: 3</button>
          </div>
          <div class="field-group hidden">
            <label for="player-0-name">Nombre</label>
            <input id="player-0-name" type="text" placeholder="Nombre del jugador" />
          </div>
          <div class="field-group hidden">
            <label for="player-0-hp">Vida máxima</label>
            <input id="player-0-hp" type="number" min="1" value="20" />
          </div>
          <div class="field-group hidden">
            <label for="player-0-stamina">Stamina máxima</label>
            <input id="player-0-stamina" type="number" min="1" value="10" />
          </div>
          <div class="field-group hidden">
            <label for="player-0-dex">Destreza (-5 a 5)</label>
            <input id="player-0-dex" type="number" min="-5" max="5" value="3" />
          </div>
          <button class="primary-button" data-player="0" id="save-player-0">Guardar jugador 1</button>
        </article>

        <article class="player-card" id="player-1-card">
          <button class="player-title-button" data-player="1" id="player-1-title" type="button">Jugador 2</button>
          <div class="attribute-buttons-row">
            <button class="attribute-pill" data-player="1" data-attr="hp" type="button">Vida: 20</button>
            <button class="attribute-pill" data-player="1" data-attr="stamina" type="button">Stamina: 10</button>
            <button class="attribute-pill" data-player="1" data-attr="dex" type="button">Destreza: 3</button>
          </div>
          <div class="field-group hidden">
            <label for="player-1-name">Nombre</label>
            <input id="player-1-name" type="text" placeholder="Nombre del jugador" />
          </div>
          <div class="field-group hidden">
            <label for="player-1-hp">Vida máxima</label>
            <input id="player-1-hp" type="number" min="1" value="20" />
          </div>
          <div class="field-group hidden">
            <label for="player-1-stamina">Stamina máxima</label>
            <input id="player-1-stamina" type="number" min="1" value="10" />
          </div>
          <div class="field-group hidden">
            <label for="player-1-dex">Destreza (-5 a 5)</label>
            <input id="player-1-dex" type="number" min="-5" max="5" value="3" />
          </div>
          <button class="primary-button" data-player="1" id="save-player-1">Guardar jugador 2</button>
        </article>
      </div>

      <div class="actions-row">
        <button class="primary-button" id="start-duel" disabled>Comenzar duelo</button>
      </div>
    </section>

    <section id="roll-screen" class="screen">
      <div class="roll-box">
        <h2>Decidir quién empieza</h2>
        <p id="roll-text">Pulsa comenzar para lanzar el dado de 1 a 20 para cada jugador.</p>
        <button class="primary-button" id="roll-button">Lanzar dados</button>
        <p class="muted" id="starter-text"></p>
        <button class="primary-button hidden" id="confirm-start">Comenzar batalla</button>
      </div>
    </section>

    <section id="battle-screen" class="screen">
      <div class="battle-header">
        <h2 id="battle-title">Turno de jugador</h2>
        <div class="player-status">
          <span id="current-turn-label"></span>
        </div>
      </div>

      <div class="action-buttons-grid">
        <div class="action-row action-row-top">
          <button class="status-card action-health" data-action="health" id="action-health">
            <strong>Vida</strong>
            <div class="stat-value" id="stat-health"></div>
            <progress id="health-bar" max="100" value="0"></progress>
          </button>
          <button class="status-card action-stamina" data-action="stamina" id="action-stamina">
            <strong>Stamina</strong>
            <div class="stat-value" id="stat-stamina"></div>
            <progress id="stamina-bar" max="100" value="0"></progress>
          </button>
        </div>
        <div class="action-row action-row-middle">
          <button class="status-card action-block" data-action="block" id="action-block">
            <strong>Bloqueo</strong>
            <div class="stat-value" id="stat-block"></div>
          </button>
          <button class="status-card action-attack" data-action="attack" id="action-attack">
            <strong>Daño</strong>
            <div class="stat-value">Atacar</div>
          </button>
          <button class="status-card action-self-damage" data-action="self-damage" id="action-self-damage">
            <strong>Autodaño</strong>
            <div class="stat-value">Infligirse daño</div>
          </button>
        </div>
        <div class="action-row action-row-bottom">
          <div style="display:flex;flex-direction:column;gap:6px;width:100%">
            <button class="status-card action-pass" data-action="pass" id="action-pass" style="width:100%">
              <strong>Pasar</strong>
              <div class="stat-value">Ganar Stamina</div>
            </button>
            <button class="status-card end-turn-button" id="end-turn" style="width:100%">
              <strong>Finalizar</strong>
              <div class="stat-value">Turno</div>
            </button>
          </div>
        </div>
      </div>

      <!-- fullscreen popup button (small, non-intrusive) -->
      <button id="fullscreen-popup" class="fullscreen-popup" aria-label="Pantalla completa">⤢</button>

      <div class="action-panel hidden" id="action-panel">
        <h3 id="action-panel-title"></h3>
        <div class="action-content" id="action-content"></div>
      </div>

      <div class="battle-log" id="battle-log"></div>
    </section>
  </main>

  <script src="script.js?v=20260730-5"></script>
</body>
</html>
